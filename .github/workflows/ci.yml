name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  statuses: write

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:frontend

      - name: Build
        run: npm run build:frontend

  backend:
    runs-on: ubuntu-latest
    outputs:
      restore: ${{ steps.restore.outcome }}
      build: ${{ steps.build.outcome }}
      test: ${{ steps.test.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - id: restore
        name: Restore
        continue-on-error: true
        run: dotnet restore backend/OpenMusicVideoCreator.sln

      - id: build
        name: Build
        if: ${{ steps.restore.outcome == 'success' }}
        continue-on-error: true
        run: dotnet build backend/OpenMusicVideoCreator.sln -c Release --no-restore

      - id: test
        name: Test
        if: ${{ steps.restore.outcome == 'success' && steps.build.outcome == 'success' }}
        continue-on-error: true
        run: dotnet test backend/OpenMusicVideoCreator.sln -c Release --no-build

      - name: Enforce backend result
        if: ${{ always() }}
        env:
          RESTORE_RESULT: ${{ steps.restore.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
          TEST_RESULT: ${{ steps.test.outcome }}
        run: |
          if [ "$RESTORE_RESULT" != "success" ] || [ "$BUILD_RESULT" != "success" ] || [ "$TEST_RESULT" != "success" ]; then
            echo "Backend validation failed: restore=$RESTORE_RESULT build=$BUILD_RESULT test=$TEST_RESULT"
            exit 1
          fi

  report-main-status:
    if: ${{ always() && github.event_name == 'push' }}
    needs:
      - frontend
      - backend
    runs-on: ubuntu-latest
    steps:
      - name: Report commit statuses
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          RESTORE_RESULT: ${{ needs.backend.outputs.restore }}
          BUILD_RESULT: ${{ needs.backend.outputs.build }}
          TEST_RESULT: ${{ needs.backend.outputs.test }}
        run: |
          post_status() {
            local context="$1"
            local state="$2"
            local description="$3"
            curl --fail-with-body --silent --show-error \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPOSITORY/statuses/$SHA" \
              -d "{\"state\":\"$state\",\"context\":\"$context\",\"description\":\"$description\"}"
          }

          to_state() {
            if [ "$1" = "success" ]; then echo success; else echo failure; fi
          }

          frontend_state=$(to_state "$FRONTEND_RESULT")
          backend_state=$(to_state "$BACKEND_RESULT")
          restore_state=$(to_state "$RESTORE_RESULT")
          build_state=$(to_state "$BUILD_RESULT")
          test_state=$(to_state "$TEST_RESULT")

          post_status "ci/frontend" "$frontend_state" "frontend=$FRONTEND_RESULT"
          post_status "ci/backend/restore" "$restore_state" "restore=$RESTORE_RESULT"
          post_status "ci/backend/build" "$build_state" "build=$BUILD_RESULT"
          post_status "ci/backend/test" "$test_state" "test=$TEST_RESULT"
          post_status "ci/backend" "$backend_state" "backend=$BACKEND_RESULT"

          combined_state=success
          if [ "$frontend_state" != "success" ] || [ "$backend_state" != "success" ]; then
            combined_state=failure
          fi
          post_status "ci/combined" "$combined_state" "frontend=$FRONTEND_RESULT backend=$BACKEND_RESULT"

          if [ "$combined_state" != "success" ]; then
            exit 1
          fi
