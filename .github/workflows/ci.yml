name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test:frontend
      - name: Build
        run: npm run build:frontend

  backend:
    runs-on: ubuntu-latest
    outputs:
      restore: ${{ steps.restore.outcome }}
      build_domain: ${{ steps.build_domain.outcome }}
      build_application: ${{ steps.build_application.outcome }}
      build_infrastructure: ${{ steps.build_infrastructure.outcome }}
      build_api: ${{ steps.build_api.outcome }}
      build_architecture_tests: ${{ steps.build_architecture_tests.outcome }}
      build_api_tests: ${{ steps.build_api_tests.outcome }}
      architecture_tests: ${{ steps.architecture_tests.outcome }}
      system_tests: ${{ steps.system_tests.outcome }}
      project_tests: ${{ steps.project_tests.outcome }}
      persistence_tests: ${{ steps.persistence_tests.outcome }}
      provider_catalog_test: ${{ steps.provider_catalog_test.outcome }}
      provider_secret_test: ${{ steps.provider_secret_test.outcome }}
      provider_validation_test: ${{ steps.provider_validation_test.outcome }}
      provider_mock_test: ${{ steps.provider_mock_test.outcome }}
      job_engine_tests: ${{ steps.job_engine_tests.outcome }}
      job_api_tests: ${{ steps.job_api_tests.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - id: restore
        name: Restore
        continue-on-error: true
        run: dotnet restore backend/OpenMusicVideoCreator.sln
      - id: build_domain
        name: Build Domain
        if: ${{ steps.restore.outcome == 'success' }}
        continue-on-error: true
        run: dotnet build backend/src/OpenMusicVideoCreator.Domain/OpenMusicVideoCreator.Domain.csproj -c Release --no-restore
      - id: build_application
        name: Build Application
        if: ${{ steps.restore.outcome == 'success' && steps.build_domain.outcome == 'success' }}
        continue-on-error: true
        run: dotnet build backend/src/OpenMusicVideoCreator.Application/OpenMusicVideoCreator.Application.csproj -c Release --no-restore
      - id: build_infrastructure
        name: Build Infrastructure
        if: ${{ steps.restore.outcome == 'success' && steps.build_application.outcome == 'success' }}
        continue-on-error: true
        run: dotnet build backend/src/OpenMusicVideoCreator.Infrastructure/OpenMusicVideoCreator.Infrastructure.csproj -c Release --no-restore
      - id: build_api
        name: Build API
        if: ${{ steps.restore.outcome == 'success' && steps.build_infrastructure.outcome == 'success' }}
        continue-on-error: true
        run: dotnet build backend/src/OpenMusicVideoCreator.Api/OpenMusicVideoCreator.Api.csproj -c Release --no-restore
      - id: build_architecture_tests
        name: Build architecture tests
        if: ${{ steps.restore.outcome == 'success' && steps.build_api.outcome == 'success' }}
        continue-on-error: true
        run: dotnet build backend/tests/OpenMusicVideoCreator.ArchitectureTests/OpenMusicVideoCreator.ArchitectureTests.csproj -c Release --no-restore
      - id: build_api_tests
        name: Build API tests
        if: ${{ steps.restore.outcome == 'success' && steps.build_api.outcome == 'success' }}
        continue-on-error: true
        run: dotnet build backend/tests/OpenMusicVideoCreator.Api.Tests/OpenMusicVideoCreator.Api.Tests.csproj -c Release --no-restore
      - id: architecture_tests
        name: Architecture tests
        if: ${{ steps.build_architecture_tests.outcome == 'success' && steps.build_api_tests.outcome == 'success' }}
        continue-on-error: true
        run: dotnet test backend/tests/OpenMusicVideoCreator.ArchitectureTests/OpenMusicVideoCreator.ArchitectureTests.csproj -c Release --no-build
      - id: system_tests
        name: System API tests
        if: ${{ steps.build_api_tests.outcome == 'success' }}
        continue-on-error: true
        run: dotnet test backend/tests/OpenMusicVideoCreator.Api.Tests/OpenMusicVideoCreator.Api.Tests.csproj -c Release --no-build --filter FullyQualifiedName~SystemEndpointTests
      - id: project_tests
        name: Project API tests
        if: ${{ steps.build_api_tests.outcome == 'success' }}
        continue-on-error: true
        run: dotnet test backend/tests/OpenMusicVideoCreator.Api.Tests/OpenMusicVideoCreator.Api.Tests.csproj -c Release --no-build --filter FullyQualifiedName~ProjectEndpointTests
      - id: persistence_tests
        name: Persistence tests
        if: ${{ steps.build_api_tests.outcome == 'success' }}
        continue-on-error: true
        run: dotnet test backend/tests/OpenMusicVideoCreator.Api.Tests/OpenMusicVideoCreator.Api.Tests.csproj -c Release --no-build --filter FullyQualifiedName~PersistenceIntegrationTests
      - id: provider_catalog_test
        name: Provider catalog test
        if: ${{ steps.build_api_tests.outcome == 'success' }}
        continue-on-error: true
        run: dotnet test backend/tests/OpenMusicVideoCreator.Api.Tests/OpenMusicVideoCreator.Api.Tests.csproj -c Release --no-build --filter FullyQualifiedName~ProviderApi_ListsCapabilityDrivenMockCatalog
      - id: provider_secret_test
        name: Provider secret persistence test
        if: ${{ steps.build_api_tests.outcome == 'success' }}
        continue-on-error: true
        run: dotnet test backend/tests/OpenMusicVideoCreator.Api.Tests/OpenMusicVideoCreator.Api.Tests.csproj -c Release --no-build --filter FullyQualifiedName~ProviderSettings_PersistReferenceButNeverSecretValue
      - id: provider_validation_test
        name: Provider settings validation test
        if: ${{ steps.build_api_tests.outcome == 'success' }}
        continue-on-error: true
        run: dotnet test backend/tests/OpenMusicVideoCreator.Api.Tests/OpenMusicVideoCreator.Api.Tests.csproj -c Release --no-build --filter FullyQualifiedName~ProviderSettings_RejectUnsupportedModelCapabilityPair
      - id: provider_mock_test
        name: Mock provider behavior test
        if: ${{ steps.build_api_tests.outcome == 'success' }}
        continue-on-error: true
        run: dotnet test backend/tests/OpenMusicVideoCreator.Api.Tests/OpenMusicVideoCreator.Api.Tests.csproj -c Release --no-build --filter FullyQualifiedName~MockProviders_NormalizeSuccessDelayAndFailureScenarios
      - id: job_engine_tests
        name: Persistent job engine tests
        if: ${{ steps.build_api_tests.outcome == 'success' }}
        continue-on-error: true
        run: dotnet test backend/tests/OpenMusicVideoCreator.Api.Tests/OpenMusicVideoCreator.Api.Tests.csproj -c Release --no-build --filter FullyQualifiedName~JobEngineIntegrationTests
      - id: job_api_tests
        name: Job API and stream tests
        if: ${{ steps.build_api_tests.outcome == 'success' }}
        continue-on-error: true
        run: dotnet test backend/tests/OpenMusicVideoCreator.Api.Tests/OpenMusicVideoCreator.Api.Tests.csproj -c Release --no-build --filter FullyQualifiedName~JobApiTests
      - name: Enforce backend result
        if: ${{ always() }}
        env:
          RESTORE_RESULT: ${{ steps.restore.outcome }}
          BUILD_DOMAIN_RESULT: ${{ steps.build_domain.outcome }}
          BUILD_APPLICATION_RESULT: ${{ steps.build_application.outcome }}
          BUILD_INFRASTRUCTURE_RESULT: ${{ steps.build_infrastructure.outcome }}
          BUILD_API_RESULT: ${{ steps.build_api.outcome }}
          BUILD_ARCH_TESTS_RESULT: ${{ steps.build_architecture_tests.outcome }}
          BUILD_API_TESTS_RESULT: ${{ steps.build_api_tests.outcome }}
          ARCHITECTURE_RESULT: ${{ steps.architecture_tests.outcome }}
          SYSTEM_RESULT: ${{ steps.system_tests.outcome }}
          PROJECT_RESULT: ${{ steps.project_tests.outcome }}
          PERSISTENCE_RESULT: ${{ steps.persistence_tests.outcome }}
          PROVIDER_CATALOG_RESULT: ${{ steps.provider_catalog_test.outcome }}
          PROVIDER_SECRET_RESULT: ${{ steps.provider_secret_test.outcome }}
          PROVIDER_VALIDATION_RESULT: ${{ steps.provider_validation_test.outcome }}
          PROVIDER_MOCK_RESULT: ${{ steps.provider_mock_test.outcome }}
          JOB_ENGINE_RESULT: ${{ steps.job_engine_tests.outcome }}
          JOB_API_RESULT: ${{ steps.job_api_tests.outcome }}
        run: |
          results="$RESTORE_RESULT $BUILD_DOMAIN_RESULT $BUILD_APPLICATION_RESULT $BUILD_INFRASTRUCTURE_RESULT $BUILD_API_RESULT $BUILD_ARCH_TESTS_RESULT $BUILD_API_TESTS_RESULT $ARCHITECTURE_RESULT $SYSTEM_RESULT $PROJECT_RESULT $PERSISTENCE_RESULT $PROVIDER_CATALOG_RESULT $PROVIDER_SECRET_RESULT $PROVIDER_VALIDATION_RESULT $PROVIDER_MOCK_RESULT $JOB_ENGINE_RESULT $JOB_API_RESULT"
          for result in $results; do
            if [ "$result" != "success" ]; then
              echo "Backend validation failed."
              exit 1
            fi
          done

  report-main-status:
    if: ${{ always() && github.event_name == 'push' }}
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    steps:
      - name: Report commit statuses
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          RESTORE_RESULT: ${{ needs.backend.outputs.restore }}
          BUILD_DOMAIN_RESULT: ${{ needs.backend.outputs.build_domain }}
          BUILD_APPLICATION_RESULT: ${{ needs.backend.outputs.build_application }}
          BUILD_INFRASTRUCTURE_RESULT: ${{ needs.backend.outputs.build_infrastructure }}
          BUILD_API_RESULT: ${{ needs.backend.outputs.build_api }}
          BUILD_ARCH_TESTS_RESULT: ${{ needs.backend.outputs.build_architecture_tests }}
          BUILD_API_TESTS_RESULT: ${{ needs.backend.outputs.build_api_tests }}
          ARCHITECTURE_RESULT: ${{ needs.backend.outputs.architecture_tests }}
          SYSTEM_RESULT: ${{ needs.backend.outputs.system_tests }}
          PROJECT_RESULT: ${{ needs.backend.outputs.project_tests }}
          PERSISTENCE_RESULT: ${{ needs.backend.outputs.persistence_tests }}
          PROVIDER_CATALOG_RESULT: ${{ needs.backend.outputs.provider_catalog_test }}
          PROVIDER_SECRET_RESULT: ${{ needs.backend.outputs.provider_secret_test }}
          PROVIDER_VALIDATION_RESULT: ${{ needs.backend.outputs.provider_validation_test }}
          PROVIDER_MOCK_RESULT: ${{ needs.backend.outputs.provider_mock_test }}
          JOB_ENGINE_RESULT: ${{ needs.backend.outputs.job_engine_tests }}
          JOB_API_RESULT: ${{ needs.backend.outputs.job_api_tests }}
        run: |
          post_status() {
            local context="$1"
            local state="$2"
            local description="$3"
            curl --fail-with-body --silent --show-error -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPOSITORY/statuses/$SHA" \
              -d "{\"state\":\"$state\",\"context\":\"$context\",\"description\":\"$description\",\"target_url\":\"$RUN_URL\"}"
          }
          to_state() { if [ "$1" = "success" ]; then echo success; else echo failure; fi; }
          post_status "ci/frontend" "$(to_state "$FRONTEND_RESULT")" "frontend=$FRONTEND_RESULT"
          post_status "ci/backend/restore" "$(to_state "$RESTORE_RESULT")" "restore=$RESTORE_RESULT"
          post_status "ci/backend/build/domain" "$(to_state "$BUILD_DOMAIN_RESULT")" "domain=$BUILD_DOMAIN_RESULT"
          post_status "ci/backend/build/application" "$(to_state "$BUILD_APPLICATION_RESULT")" "application=$BUILD_APPLICATION_RESULT"
          post_status "ci/backend/build/infrastructure" "$(to_state "$BUILD_INFRASTRUCTURE_RESULT")" "infrastructure=$BUILD_INFRASTRUCTURE_RESULT"
          post_status "ci/backend/build/api" "$(to_state "$BUILD_API_RESULT")" "api=$BUILD_API_RESULT"
          post_status "ci/backend/build/architecture-tests" "$(to_state "$BUILD_ARCH_TESTS_RESULT")" "architecture_tests=$BUILD_ARCH_TESTS_RESULT"
          post_status "ci/backend/build/api-tests" "$(to_state "$BUILD_API_TESTS_RESULT")" "api_tests=$BUILD_API_TESTS_RESULT"
          post_status "ci/backend/test/architecture" "$(to_state "$ARCHITECTURE_RESULT")" "architecture=$ARCHITECTURE_RESULT"
          post_status "ci/backend/test/system" "$(to_state "$SYSTEM_RESULT")" "system=$SYSTEM_RESULT"
          post_status "ci/backend/test/project" "$(to_state "$PROJECT_RESULT")" "project=$PROJECT_RESULT"
          post_status "ci/backend/test/persistence" "$(to_state "$PERSISTENCE_RESULT")" "persistence=$PERSISTENCE_RESULT"
          post_status "ci/backend/test/provider-catalog" "$(to_state "$PROVIDER_CATALOG_RESULT")" "provider_catalog=$PROVIDER_CATALOG_RESULT"
          post_status "ci/backend/test/provider-secret" "$(to_state "$PROVIDER_SECRET_RESULT")" "provider_secret=$PROVIDER_SECRET_RESULT"
          post_status "ci/backend/test/provider-validation" "$(to_state "$PROVIDER_VALIDATION_RESULT")" "provider_validation=$PROVIDER_VALIDATION_RESULT"
          post_status "ci/backend/test/provider-mock" "$(to_state "$PROVIDER_MOCK_RESULT")" "provider_mock=$PROVIDER_MOCK_RESULT"
          post_status "ci/backend/test/job-engine" "$(to_state "$JOB_ENGINE_RESULT")" "job_engine=$JOB_ENGINE_RESULT"
          post_status "ci/backend/test/job-api" "$(to_state "$JOB_API_RESULT")" "job_api=$JOB_API_RESULT"
          backend_state=$(to_state "$BACKEND_RESULT")
          post_status "ci/backend" "$backend_state" "backend=$BACKEND_RESULT"
          combined_state=success
          if [ "$(to_state "$FRONTEND_RESULT")" != "success" ] || [ "$backend_state" != "success" ]; then combined_state=failure; fi
          post_status "ci/combined" "$combined_state" "frontend=$FRONTEND_RESULT backend=$BACKEND_RESULT"
          if [ "$combined_state" != "success" ]; then exit 1; fi
