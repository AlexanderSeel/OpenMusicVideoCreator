name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  statuses: write

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:frontend

      - name: Build
        run: npm run build:frontend

  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore backend/OpenMusicVideoCreator.sln

      - name: Build
        run: dotnet build backend/OpenMusicVideoCreator.sln -c Release --no-restore

      - name: Test
        run: dotnet test backend/OpenMusicVideoCreator.sln -c Release --no-build

  report-main-status:
    if: ${{ always() && github.event_name == 'push' }}
    needs:
      - frontend
      - backend
    runs-on: ubuntu-latest
    steps:
      - name: Report commit statuses
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
        run: |
          post_status() {
            local context="$1"
            local state="$2"
            local description="$3"
            curl --fail-with-body --silent --show-error \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPOSITORY/statuses/$SHA" \
              -d "{\"state\":\"$state\",\"context\":\"$context\",\"description\":\"$description\"}"
          }

          frontend_state=failure
          backend_state=failure
          if [ "$FRONTEND_RESULT" = "success" ]; then frontend_state=success; fi
          if [ "$BACKEND_RESULT" = "success" ]; then backend_state=success; fi

          post_status "ci/frontend" "$frontend_state" "frontend=$FRONTEND_RESULT"
          post_status "ci/backend" "$backend_state" "backend=$BACKEND_RESULT"

          combined_state=success
          if [ "$frontend_state" != "success" ] || [ "$backend_state" != "success" ]; then
            combined_state=failure
          fi
          post_status "ci/combined" "$combined_state" "frontend=$FRONTEND_RESULT backend=$BACKEND_RESULT"

          if [ "$combined_state" != "success" ]; then
            exit 1
          fi
